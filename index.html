<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SofiaCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SofiaCare</h1>
    <p class="subtitle">A project inspired by Sofia</p>
  </header>

  <main id="sofia-profile">
    <img src="images/sofia.jpg" alt="Sofía placeholder" class="sofia-img">

    <h2>Meet Sofia</h2>
    <p>
      Sofia is a small, loving, curious dog with a gentle temperament.
      This project uses TheDogAPI to explore dog breeds that share traits
      similar to hers.
    </p>

    <button id="see-similar">See dogs similar to Sofia</button>
  </main>

  <script src="sofia.js"></script>
</body>
</html>
